# Tanıtım sitesi (sipsakye.com) — statik HTML/CSS/JS, derleme adımı yok.
# Mevcut sipsakye-caddy'nin arkasında, ayrı bir container olarak çalışır;
# backend/admin servislerine dokunmaz.
#
# Start:   docker compose -f deploy/docker-compose.promo.yml up -d
# Güncelle: git pull sonrası → docker compose -f deploy/docker-compose.promo.yml restart

services:
  promo:
    image: nginx:alpine
    container_name: sipsakye-promo
    volumes:
      - ../:/usr/share/nginx/html:ro
      - ./nginx.promo.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - sipsakye

networks:
  sipsakye:
    external: true
