##
## Şipşak Ye — Nginx sunucu bloğu
##
## Kurulum:
##   sudo cp deploy/nginx.conf /etc/nginx/sites-available/sipsakye.com
##   sudo ln -s /etc/nginx/sites-available/sipsakye.com /etc/nginx/sites-enabled/
##   sudo rm -f /etc/nginx/sites-enabled/default
##   sudo nginx -t && sudo systemctl reload nginx
##
## Ayrıntılı adımlar: deploy/DEPLOY.md
##

# Cloudflare'in gerçek ziyaretçi IP'sini loglara yansıtması için.
# Güncel liste: https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ---------------------------------------------------------------------------
# HTTP -> HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name sipsakye.com www.sipsakye.com;

    # Let's Encrypt kullanacaksanız bu blok gerekli (Cloudflare Origin
    # sertifikası kullanıyorsanız silebilirsiniz).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://sipsakye.com$request_uri;
    }
}

# ---------------------------------------------------------------------------
# www -> kök alan adı
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.sipsakye.com;

    ssl_certificate     /etc/ssl/cloudflare/sipsakye.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/sipsakye.com.key;

    return 301 https://sipsakye.com$request_uri;
}

# ---------------------------------------------------------------------------
# Ana site
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sipsakye.com;

    root /var/www/sipsakye.com;
    index index.html;
    charset utf-8;

    # --- TLS ---
    # Cloudflare Origin Certificate yolları. Let's Encrypt kullanıyorsanız:
    #   /etc/letsencrypt/live/sipsakye.com/fullchain.pem
    #   /etc/letsencrypt/live/sipsakye.com/privkey.pem
    ssl_certificate     /etc/ssl/cloudflare/sipsakye.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/sipsakye.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Güvenlik başlıkları ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    # Site tamamen statik; harici kaynak yüklemiyor.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # --- Sıkıştırma ---
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/manifest+json image/svg+xml;

    # Brotli modülü kuruluysa (nginx-module-brotli) aşağıyı açın:
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/javascript application/json
    #              application/manifest+json image/svg+xml;

    # --- Önbellek ---
    # Statik varlıklar uzun süreli; içerik değişirse dosya adını değiştirin
    # ya da ?v=2 gibi bir sorgu parametresi ekleyin.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    location ~* \.(?:png|svg|jpg|jpeg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # HTML her zaman taze doğrulansın — hukuki metin güncellendiğinde
    # ziyaretçi eski sürümü görmesin.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    types {
        application/manifest+json webmanifest;
    }

    # --- Yönlendirme ---
    # /destek gibi uzantısız adresler de çalışsın.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Gizli dosyalara erişim yok
    location ~ /\. { deny all; }
}
