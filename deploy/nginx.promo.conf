##
## Şipşak Ye — tanıtım sitesi, container-içi nginx yapılandırması
##
## Bu dosya native/host nginx için DEĞİL; sipsakye-promo Docker container'ının
## içinde çalışır. TLS ve sipsakye.com yönlendirmesi mevcut Caddy (sipsakye-caddy)
## tarafından yapılır — burada sadece düz HTTP üzerinden statik dosya servisi var.
##
## Kurulum: deploy/docker-compose.promo.yml
##

server {
    listen 80;
    server_name sipsakye.com www.sipsakye.com;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # --- Sıkıştırma ---
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/manifest+json image/svg+xml;

    # --- Önbellek ---
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    location ~* \.(?:png|svg|jpg|jpeg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # HTML her zaman taze doğrulansın — hukuki metin güncellendiğinde
    # ziyaretçi eski sürümü görmesin.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    types {
        application/manifest+json webmanifest;
    }

    # /destek gibi uzantısız adresler de çalışsın.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Gizli dosyalara erişim yok
    location ~ /\. { deny all; }
}
